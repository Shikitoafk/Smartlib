<html lang="ru">

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Школьная библиотека</title>

  <style>
    :root {
      --bg: #f0f4ff;
      --white: #ffffff;
      --shadow: 0 2px 16px rgba(80,100,180,0.10);
      --shadow-hover: 0 8px 32px rgba(80,100,180,0.18);
      --radius: 20px;
      --c7:  #3b6ef6;
      --c8:  #22b573;
      --c9:  #a855f7;
      --c10: #f97316;
      --c11: #e11d48;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Nunito', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      color: #1e2340;
    }

    /* ── HEADER ── */
    header {
      background: var(--white);
      border-bottom: 1.5px solid #e8ecf8;
      position: sticky; top: 0; z-index: 50;
    }
    .header-inner {
      max-width: 700px; margin: 0 auto;
      padding: 14px 20px;
      display: flex; align-items: center; gap: 12px;
    }
    .logo {
      width: 40px; height: 40px; border-radius: 14px;
      background: linear-gradient(135deg, #3b6ef6, #8b5cf6);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0;
      transition: transform 0.15s;
    }
    .logo:hover { transform: scale(1.07); }
    .header-text { flex: 1; }
    .header-title { font-size: 15px; font-weight: 800; color: #1e2340; }
    .breadcrumb { font-size: 12px; color: #9099c0; margin-top: 1px; font-weight: 600; }

    /* ── MAIN ── */
    main { max-width: 700px; margin: 0 auto; padding: 32px 20px 80px; }

    /* ── SCREENS ── */
    .screen { display: none; }
    .screen.active { display: block; animation: fadeUp 0.22s ease; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── PAGE TITLE ── */
    .page-title { font-size: 26px; font-weight: 900; color: #1e2340; margin-bottom: 4px; }
    .page-sub   { font-size: 13px; color: #9099c0; font-weight: 600; margin-bottom: 28px; }

    /* ── BACK BTN ── */
    .back-row { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
    .btn-back {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--white); border: none; border-radius: 12px;
      padding: 8px 14px; font-size: 13px; font-weight: 700;
      color: #4a5280; cursor: pointer;
      box-shadow: var(--shadow);
      transition: background 0.15s, transform 0.12s;
      font-family: 'Nunito', sans-serif;
    }
    .btn-back:hover { background: #f0f4ff; transform: translateX(-2px); }

    .screen-head { }
    .screen-head h2 { font-size: 22px; font-weight: 900; color: #1e2340; }
    .screen-head p  { font-size: 12px; color: #9099c0; font-weight: 600; margin-top: 2px; }

    /* ── GRADE GRID ── */
    .grades-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }
    @media (min-width: 480px) {
      .grades-grid { grid-template-columns: repeat(3, 1fr); }
    }

    .grade-card {
      border-radius: var(--radius);
      padding: 28px 16px 22px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer; min-height: 130px;
      box-shadow: var(--shadow);
      transition: box-shadow 0.18s, transform 0.18s;
      position: relative; overflow: hidden;
      border: 2.5px solid transparent;
    }
    .grade-card::before {
      content: '';
      position: absolute; inset: 0;
      opacity: 0.06;
      background: radial-gradient(circle at 70% 30%, #fff 0%, transparent 60%);
    }
    .grade-card:hover {
      box-shadow: var(--shadow-hover);
      transform: translateY(-4px) scale(1.02);
    }
    .grade-card:active { transform: translateY(0) scale(0.99); }
    .grade-num {
      font-size: 50px; font-weight: 900; line-height: 1;
      letter-spacing: -2px; position: relative;
    }
    .grade-label {
      font-size: 13px; font-weight: 800; margin-top: 6px; position: relative;
    }
    .grade-count {
      font-size: 11px; font-weight: 700; margin-top: 4px;
      opacity: 0.6; position: relative;
    }

    /* ── SUBJECT LIST ── */
    .subjects-list { display: flex; flex-direction: column; gap: 10px; }

    .subject-card {
      background: var(--white); border-radius: 16px;
      padding: 14px 18px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      cursor: pointer; box-shadow: var(--shadow);
      transition: box-shadow 0.18s, transform 0.15s;
      border: 2px solid transparent;
    }
    .subject-card:hover {
      box-shadow: var(--shadow-hover);
      transform: translateX(4px);
      border-color: #e8ecf8;
    }
    .subject-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .subject-icon {
      width: 40px; height: 40px; border-radius: 12px;
      background: #eef2ff;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; font-size: 20px;
    }
    .subject-name {
      font-size: 14px; font-weight: 800; color: #1e2340;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .subject-meta { font-size: 12px; color: #9099c0; font-weight: 600; margin-top: 2px; }

    .subject-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .chevron { color: #c8cfe8; }

    /* ── BADGES ── */
    .badge {
      padding: 4px 11px; border-radius: 99px;
      font-size: 12px; font-weight: 800;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .badge-ok   { background: #ecfdf5; color: #059669; }
    .badge-lost { background: #fff1f2; color: #e11d48; }
    .badge-warn { background: #fffbeb; color: #d97706; }

    /* ── STATS ROW ── */
    .stats-row { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .stat-pill {
      background: var(--white); border-radius: 12px;
      padding: 8px 16px; font-size: 13px; font-weight: 700;
      color: #4a5280; box-shadow: var(--shadow);
    }

    /* ── TABLE ── */
    .table-wrap {
      background: var(--white); border-radius: 18px;
      overflow: hidden; box-shadow: var(--shadow);
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead tr { background: #f8fafd; }
    th {
      text-align: left; padding: 12px 16px;
      color: #9099c0; font-size: 11px; font-weight: 800;
      text-transform: uppercase; letter-spacing: 0.06em;
    }
    tbody tr { border-top: 1px solid #f0f4ff; transition: background 0.1s; }
    tbody tr:hover { background: #f8fafd; }
    td { padding: 11px 16px; }
    .student-name { font-weight: 800; color: #1e2340; }
    .student-class { color: #9099c0; font-weight: 600; }
    .book-num { font-family: monospace; font-size: 13px; color: #4a5280; font-weight: 700; background: #f0f4ff; padding: 2px 8px; border-radius: 6px; }
    td:last-child { text-align: right; }

    /* ── SPINNER ── */
    .spinner {
      width: 32px; height: 32px; border: 3px solid #e8ecf8;
      border-top-color: #3b6ef6; border-radius: 50%;
      animation: spin 0.7s linear infinite; margin: 48px auto; display: block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── EMPTY ── */
    .empty { text-align: center; padding: 40px 20px; color: #9099c0; font-weight: 700; font-size: 14px; }

    /* ── SEARCH BAR ── */
    .search-wrap { position: relative; margin-bottom: 18px; }
    .search-input {
      width: 100%; padding: 12px 16px 12px 44px;
      border: 2px solid #e8ecf8; border-radius: 14px;
      font-size: 14px; font-weight: 700; font-family: 'Nunito', sans-serif;
      background: var(--white); color: #1e2340; outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .search-input:focus { border-color: #3b6ef6; box-shadow: 0 0 0 3px rgba(59,110,246,0.1); }
    .search-input::placeholder { color: #b8bfd8; font-weight: 600; }
    .search-icon {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      color: #b8bfd8; pointer-events: none;
    }

    /* ── HIDDEN ── */
    .hidden { display: none !important; }
  </style>
</head>

      </div>
    </div>

    <div class="stats-row">
      <span class="stat-pill" id="stat-total"></span>

      <span class="badge badge-lost" id="stat-lost" style="font-size:13px;padding:8px 14px;border-radius:12px;"></span>
    </div>

    <div class="search-wrap">

        <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
        <path stroke="currentColor" stroke-width="2" stroke-linecap="round" d="m21 21-4.35-4.35"/>
      </svg>
      <input class="search-input" id="search-input" type="text" placeholder="Поиск по имени..." oninput="filterStudents()" />
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Ученик</th>
            <th>Инв. №</th>
            <th style="text-align:right">Статус</th>
          </tr>
        </thead>
        <tbody id="students-tbody"></tbody>
      </table>
    </div>
  </div>

</main>

// Иконки предметов
const SUBJECT_ICONS = {
  'Казахский язык': '🇰🇿',
  'Математика':     '📐',
  'История':        '📜',
  'Биология':       '🌿',
  'Физика':         '⚡',
  'Химия':          '🧪',
  'Алгебра':        '🔢',
  'Қазақ тілі':     '🇰🇿',
  'Қазақстан тарихы':'📜',
  'География':      '🌍',
};
function getIcon(title) {
  return SUBJECT_ICONS[title] || '📚';
}

// Цвета классов
const GRADE_STYLES = {
  '7':  { bg: '#eff6ff', num: '#1d4ed8', label: '#3b82f6' },
  '8':  { bg: '#f0fdf4', num: '#15803d', label: '#22c55e' },
  '9':  { bg: '#fdf4ff', num: '#7e22ce', label: '#a855f7' },
  '10': { bg: '#fff7ed', num: '#c2410c', label: '#f97316' },
  '11': { bg: '#fff1f2', num: '#be123c', label: '#f43f5e' },
};

// Глобальный массив данных
let allBooksData = [];

let currentGrade = null;
let currentSubject = null;
let currentStudentsData = [];

// ─────────────────────────────────────────────
//  ИНТЕЛЛЕКТУАЛЬНАЯ НОРМАЛИЗАЦИЯ ИМЕНИ КЛАССА
// ─────────────────────────────────────────────
function normalizeClassName(name) {
  if (!name) return '';
  let str = name.trim();
  
  // Если это ровно "10 класс" или "10", маппим в "10А" для совместимости
  if (str === '10 класс' || str === '10') {
    return '10А';
  }
  
  // Вырезаем цифру и букву параллели (например, "10 Б класс" -> "10Б", "10 А" -> "10А")
  const match = str.match(/^(\d+)\s*([А-Яа-яA-Za-z]?)/);
  if (match) {
    const num = match[1];
    const letter = match[2].toUpperCase();
    if (letter) {
      return num + letter;
    }
    return num + 'А';
  }
  
  return str;
}

// ─── ЗАГРУЗКА ДАННЫХ ────────────────────────────────
async function loadAllData() {
  try {
    // 1. Получаем все имеющиеся данные из Supabase
    const { data: dbData, error } = await db
      .from('library_books')
      .select('student_class, student_name, book_title, book_number, status');

    if (error) throw error;

    const dbRecords = dbData || [];

    // Нормализуем Supabase записи (например, "10 класс" -> "10А", "10 Б" -> "10Б")
    const normalizedDbRecords = dbRecords.map(r => {
      return { ...r, student_class: normalizeClassName(r.student_class) };
    });

    // 2. Определяем, какие классы УЖЕ есть в базе Supabase
    const dbGrades = new Set();
    normalizedDbRecords.forEach(r => {
      const className = r.student_class;
      if (className) dbGrades.add(className);
    });

    // 3. Отбираем локальные данные только для тех классов, которых НЕТ в базе Supabase
    const normalizedMockData = FALLBACK_MOCK_DATA.map(r => {
      return { ...r, student_class: normalizeClassName(r.student_class) };
    });

    const fallbackRecords = normalizedMockData.filter(r => {
      const className = r.student_class;
      return className && !dbGrades.has(className);
    });

    // 4. Объединяем полученные из БД записи с резервными для недостающих классов
    allBooksData = [...normalizedDbRecords, ...fallbackRecords];
  } catch (err) {
    console.warn("Не удалось загрузить данные из Supabase. Используется локальный массив:", err);
    allBooksData = FALLBACK_MOCK_DATA.map(r => {
      return { ...r, student_class: normalizeClassName(r.student_class) };
    });
  }
}

// ─── ИНИЦИАЛИЗАЦИЯ ЭКРАНА КЛАССОВ ─────────────────
async function init() {
  const grid = document.getElementById('grades-grid');
  grid.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; padding: 40px 0;"><span class="spinner"></span></div>';

  if (allBooksData.length === 0) {
    await loadAllData();
  }

  if (allBooksData.length === 0) {
    grid.innerHTML = '<div class="empty" style="grid-column: 1 / -1;">Нет доступных данных</div>';
    return;
  }

  // Собираем уникальные классы (7А, 7Б, 8А...) и считаем количество учеников
  const classMap = new Map(); // className -> Set(student_name)
  allBooksData.forEach(r => {
    const className = r.student_class;
    if (className) {
      if (!classMap.has(className)) {
        classMap.set(className, new Set());
      }
      classMap.get(className).add(r.student_name || '');
    }
  });

  // Логическая сортировка: сначала по цифре, потом по букве А/Б
  const sortedClasses = [...classMap.keys()].sort((a, b) => {
    const numA = parseInt(a.match(/^\d+/)?.[0] || '0', 10);
    const numB = parseInt(b.match(/^\d+/)?.[0] || '0', 10);
    if (numA !== numB) {
      return numA - numB;
    }
    const letterA = a.replace(/^\d+/, '').trim();
    const letterB = b.replace(/^\d+/, '').trim();
    return letterA.localeCompare(letterB, 'ru');
  });

  grid.innerHTML = '';
  sortedClasses.forEach(className => {
    const gradeNum = className.match(/^\d+/)?.[0] || '';
    const st = GRADE_STYLES[gradeNum] || { bg: '#f8fafc', num: '#374151', label: '#6b7280' };
    const uniqueStudents = classMap.get(className).size;

    const card = document.createElement('div');
    card.className = 'grade-card';
    card.style.background = st.bg;
    card.style.borderColor = st.bg;
    card.innerHTML = `
      <span class="grade-num" style="color:${st.num}">${className}</span>
      <span class="grade-count" style="color:${st.label}; margin-top: 8px;">${uniqueStudents} учеников</span>
    `;
    card.addEventListener('click', () => openGrade(className));
    grid.appendChild(card);
  });
}

// ─── ОТКРЫТЬ КЛАСС → ПРЕДМЕТЫ ──────────────────
function openGrade(grade) {
  currentGrade = grade;
  showScreen('subjects');
  document.getElementById('subjects-title').textContent = `${grade} класс`;
  setBreadcrumb(`${grade} класс`);

  const list = document.getElementById('subjects-list');
  list.innerHTML = '';

  // Фильтруем данные по выбранному классу
  const classData = allBooksData.filter(r => r.student_class === grade);

  // Группируем по предмету
  const subjectMap = new Map();
  classData.forEach(r => {
    const title = r.book_title?.trim();
    if (!title) return;
    if (!subjectMap.has(title)) subjectMap.set(title, { total: 0, lost: 0 });
    const s = subjectMap.get(title);
    s.total++;
    if (r.status === 'lost') s.lost++;
  });

  if (subjectMap.size === 0) {
    list.innerHTML = `<div class="empty">Нет данных для этого класса</div>`;
    return;
  }

  const sortedSubjects = [...subjectMap.entries()].sort((a, b) => a[0].localeCompare(b[0], 'ru'));

  sortedSubjects.forEach(([title, stats]) => {
    const card = document.createElement('div');
    card.className = 'subject-card';
    const badge = stats.lost > 0
      ? `<span class="badge badge-lost">${stats.lost} утеряно</span>`
      : `<span class="badge badge-ok">✓ Всё ок</span>`;
    card.innerHTML = `
      <div class="subject-left">
        <div class="subject-icon">${getIcon(title)}</div>
        <div>
          <div class="subject-name">${esc(title)}</div>
          <div class="subject-meta">${stats.total} учеников</div>
        </div>
      </div>
      <div class="subject-right">
        ${badge}
        <svg class="chevron" width="16" height="16" fill="none" viewBox="0 0 24 24">
          <path stroke="currentColor" stroke-width="2.5" stroke-linecap="round" d="m9 18 6-6-6-6"/>
        </svg>
      </div>
    `;
    card.addEventListener('click', () => openSubject(grade, title));
    list.appendChild(card);
  });
}

// ─── ОТКРЫТЬ ПРЕДМЕТ → УЧЕНИКИ ─────────────────
function openSubject(grade, subject) {
  currentSubject = subject;
  showScreen('students');
  document.getElementById('students-title').textContent = subject;
  document.getElementById('students-sub').textContent = `${grade} класс`;
  setBreadcrumb(`${grade} кл → ${subject}`);
  document.getElementById('search-input').value = '';

  document.getElementById('back-btn').onclick = () => openGrade(grade);

  // Фильтруем по классу и названию книги, затем сортируем по алфавиту
  const filteredData = allBooksData.filter(r => {
    const matchesClass = r.student_class === grade;
    const matchesSubject = r.book_title?.trim() === subject;
    return matchesClass && matchesSubject;
  }).sort((a, b) => a.student_name.localeCompare(b.student_name, 'ru'));

  currentStudentsData = filteredData;

  const total = filteredData.length;
  const lost  = filteredData.filter(r => r.status === 'lost').length;
  const ok    = total - lost;

  document.getElementById('stat-total').textContent = `Всего: ${total}`;
  document.getElementById('stat-ok').textContent    = `✓ Есть: ${ok}`;
  document.getElementById('stat-lost').textContent  = `✗ Утеряно: ${lost}`;

  renderStudentsTable(filteredData);
}

function renderStudentsTable(data) {
  const tbody = document.getElementById('students-tbody');
  if (data.length === 0) {
    tbody.innerHTML = `<tr><td colspan="3" class="empty">Ничего не найдено</td></tr>`;
    return;
  }
  tbody.innerHTML = '';
  data.forEach(row => {
    const isLost = row.status === 'lost';
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><span class="student-name">${esc(row.student_name)}</span></td>
      <td><span class="book-num">${esc(row.book_number)}</span></td>
      <td>${isLost
        ? `<span class="badge badge-lost">Утеряна</span>`
        : `<span class="badge badge-ok">Есть</span>`
      }</td>
    `;
    tbody.appendChild(tr);
  });
}

function filterStudents() {
  const q = document.getElementById('search-input').value.trim().toLowerCase();
  if (!q) {
    renderStudentsTable(currentStudentsData);
    return;
  }
  const filtered = currentStudentsData.filter(r =>
    r.student_name.toLowerCase().includes(q)
  );
  renderStudentsTable(filtered);
}

// ─── НАВИГАЦИЯ ──────────────────────────────────
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(`screen-${name}`).classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function goHome() {
  currentGrade = null;
  currentSubject = null;
  showScreen('grades');
  setBreadcrumb('Все классы');
}

function setBreadcrumb(text) {
  document.getElementById('breadcrumb').textContent = text;
}

function esc(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}
