ко<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Библиотека школы</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      * { font-family: 'Inter', sans-serif; box-sizing: border-box; }
      body { background: #f4f6fa; min-height: 100vh; }

      .screen { display: none; }
      .screen.active { display: block; }

      .card {
        background: #fff;
        border-radius: 20px;
        box-shadow: 0 2px 12px rgba(0,0,0,0.07);
        transition: box-shadow 0.18s, transform 0.18s;
        cursor: pointer;
      }
      .card:hover {
        box-shadow: 0 6px 28px rgba(0,0,0,0.13);
        transform: translateY(-3px);
      }
      .card:active { transform: translateY(0); }

      .badge-active {
        background: #ecfdf5; color: #059669;
        padding: 4px 12px; border-radius: 99px;
        font-size: 13px; font-weight: 600;
        display: inline-flex; align-items: center; gap: 5px;
      }
      .badge-lost {
        background: #fff1f2; color: #e11d48;
        padding: 4px 12px; border-radius: 99px;
        font-size: 13px; font-weight: 600;
        display: inline-flex; align-items: center; gap: 5px;
      }

      .btn-back {
        display: inline-flex; align-items: center; gap-6px;
        background: #fff; border: none; border-radius: 12px;
        padding: 8px 16px; font-size: 14px; font-weight: 500;
        color: #374151; cursor: pointer;
        box-shadow: 0 2px 8px rgba(0,0,0,0.07);
        transition: background 0.15s;
      }
      .btn-back:hover { background: #f3f4f6; }

      .spinner {
        width: 32px; height: 32px;
        border: 3px solid #e5e7eb;
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: spin 0.75s linear infinite;
        margin: 40px auto;
        display: block;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      .grade-num {
        font-size: 52px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -2px;
      }

      tr:last-child td { border-bottom: none !important; }
    </style>
  </head>
  <body>
    <!-- ───── ШАПКА ───── -->
    <header
      style="
        background: #fff;
        border-bottom: 1px solid #f0f0f0;
        position: sticky;
        top: 0;
        z-index: 40;
      "
    >
      <div class="max-w-3xl mx-auto px-5 py-4 flex items-center gap-3">
        <div
          onclick="goHome()"
          style="cursor: pointer"
          class="w-9 h-9 rounded-xl bg-blue-500 flex items-center justify-center flex-shrink-0"
        >
          <svg width="20" height="20" fill="none" viewBox="0 0 24 24">
            <path
              stroke="#fff"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M4 19.5V5a2.5 2.5 0 0 1 2.5-2.5H20v15"
            />
          </svg>
        </div>
        <div style="flex: 1">
          <p class="font-semibold text-gray-900 text-[15px] leading-tight">
            Школьная библиотека
          </p>
          <p id="breadcrumb" class="text-xs text-gray-400 mt-0.5">Все классы</p>
        </div>
      </div>
    </header>

    <main class="max-w-3xl mx-auto px-5 pt-8 pb-20">
      <!-- ══════════════════════════════════════════
       ЭКРАН 1 — ВЫБОР КЛАССА
  ══════════════════════════════════════════ -->
      <div id="screen-grades" class="screen active">
        <h1 class="text-2xl font-bold text-gray-900 mb-1">Выберите класс</h1>
        <p class="text-gray-400 text-sm mb-7">Учёт школьных учебников</p>

        <div id="grades-grid" class="grid grid-cols-2 gap-4 sm:grid-cols-3">
          <!-- карточки классов вставятся сюда -->
        </div>
      </div>

      <!-- ══════════════════════════════════════════
       ЭКРАН 2 — ПРЕДМЕТЫ КЛАССА
  ══════════════════════════════════════════ -->
      <div id="screen-subjects" class="screen">
        <div class="flex items-center gap-3 mb-7">
          <button class="btn-back" onclick="goHome()">
            <svg width="16" height="16" fill="none" viewBox="0 0 24 24">
              <path
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                d="M19 12H5m0 0 7 7M5 12l7-7"
              />
            </svg>
            Назад
          </button>
          <div>
            <h2
              id="subjects-title"
              class="text-xl font-bold text-gray-900"
            ></h2>
            <p class="text-xs text-gray-400 mt-0.5">Выберите предмет</p>
          </div>
        </div>
        <div id="subjects-list" class="flex flex-col gap-3"></div>
      </div>

      <!-- ══════════════════════════════════════════
       ЭКРАН 3 — УЧЕНИКИ ПО ПРЕДМЕТУ
  ══════════════════════════════════════════ -->
      <div id="screen-students" class="screen">
        <div class="flex items-center gap-3 mb-7">
          <button class="btn-back" id="back-to-subjects">
            <svg width="16" height="16" fill="none" viewBox="0 0 24 24">
              <path
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                d="M19 12H5m0 0 7 7M5 12l7-7"
              />
            </svg>
            Назад
          </button>
          <div>
            <h2
              id="students-title"
              class="text-xl font-bold text-gray-900"
            ></h2>
            <p id="students-subtitle" class="text-xs text-gray-400 mt-0.5"></p>
          </div>
        </div>

        <!-- Счётчики -->
        <div class="flex gap-3 mb-5 flex-wrap">
          <span
            id="stat-total"
            class="bg-white rounded-xl px-4 py-2 text-sm font-medium text-gray-700 shadow-sm"
          ></span>
          <span
            id="stat-ok"
            class="badge-active text-sm px-4 py-2 rounded-xl"
            style="border-radius: 12px"
          ></span>
          <span
            id="stat-lost"
            class="badge-lost text-sm px-4 py-2 rounded-xl"
            style="border-radius: 12px"
          ></span>
        </div>

        <!-- Таблица учеников -->
        <div class="card overflow-hidden">
          <table class="w-full text-sm">
            <thead>
              <tr style="background: #f8fafc">
                <th
                  class="text-left px-5 py-3 text-gray-500 font-semibold text-xs uppercase tracking-wide"
                >
                  Ученик
                </th>
                <th
                  class="text-left px-4 py-3 text-gray-500 font-semibold text-xs uppercase tracking-wide hidden sm:table-cell"
                >
                  Кл.
                </th>
                <th
                  class="text-left px-4 py-3 text-gray-500 font-semibold text-xs uppercase tracking-wide"
                >
                  Инв. №
                </th>
                <th
                  class="text-right px-5 py-3 text-gray-500 font-semibold text-xs uppercase tracking-wide"
                >
                  Статус
                </th>
              </tr>
            </thead>
            <tbody id="students-tbody"></tbody>
          </table>
        </div>
      </div>
    </main>

    <script>
      // ─── SUPABASE ─────────────────────────────────────────────────────────────────
      const SUPABASE_URL = "https://rzhcridvgkwieauwezgk.supabase.co"; // ← вставьте ваш URL
      const SUPABASE_ANON_KEY =
        "sb_publishable_21UspTAMUfUs0soK84GBjA_Tr1TepTM"; // ← вставьте ваш Anon Key
      // ─────────────────────────────────────────────────────────────────────────────

      const { createClient } = supabase;
      const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      // Цвета для карточек классов
      const GRADE_STYLES = {
        7: { bg: "#eff6ff", num: "#1d4ed8", label: "#3b82f6" },
        8: { bg: "#f0fdf4", num: "#15803d", label: "#22c55e" },
        9: { bg: "#fdf4ff", num: "#7e22ce", label: "#a855f7" },
        10: { bg: "#fff7ed", num: "#c2410c", label: "#f97316" },
        11: { bg: "#fff1f2", num: "#be123c", label: "#f43f5e" },
      };

      let currentGrade = null;
      let currentSubject = null;

      // ─── ИНИЦИАЛИЗАЦИЯ ───────────────────────────────────────────────────────────
      async function init() {
        const gradesGrid = document.getElementById("grades-grid");
        gradesGrid.innerHTML = `<div class="col-span-2 sm:col-span-3"><span class="spinner"></span></div>`;

        // Загружаем все уникальные классы
        const { data, error } = await db
          .from("library_books")
          .select("student_class");

        if (error) {
          gradesGrid.innerHTML = `
            <div class="col-span-2 sm:col-span-3 bg-red-50 border border-red-100 rounded-2xl p-5">
              <p class="font-semibold text-red-600 mb-1">Ошибка подключения к Supabase</p>
              <p class="text-red-400 text-sm">${error.message}</p>
              <p class="text-gray-400 text-xs mt-3">Проверьте правильность SUPABASE_URL и SUPABASE_ANON_KEY в коде.<br>
              Anon key должен начинаться с <b>eyJ...</b></p>
            </div>`;
          return;
        }

        if (!data || data.length === 0) {
          gradesGrid.innerHTML = `
            <div class="col-span-2 sm:col-span-3 bg-yellow-50 border border-yellow-100 rounded-2xl p-5 text-center">
              <p class="font-semibold text-yellow-700 mb-1">Таблица пустая</p>
              <p class="text-yellow-500 text-sm">Подключение к Supabase работает, но данных нет.<br>Загрузите CSV-файл в таблицу <b>library_books</b>.</p>
            </div>`;
          return;
        }

        // Группируем по числовому номеру класса (7, 8, 9, 10, 11)
        const gradeNums = new Set();
        data.forEach((r) => {
          const num = r.student_class?.trim().split(" ")[0];
          if (num) gradeNums.add(num);
        });

        const sorted = [...gradeNums].sort((a, b) => parseInt(a) - parseInt(b));

        gradesGrid.innerHTML = "";
        sorted.forEach((grade) => {
          const st = GRADE_STYLES[grade] || {
            bg: "#f8fafc",
            num: "#374151",
            label: "#6b7280",
          };
          const card = document.createElement("div");
          card.className =
            "card p-6 flex flex-col items-center justify-center text-center min-h-[130px]";
          card.style.background = st.bg;
          card.innerHTML = `
        <span class="grade-num" style="color:${st.num}">${grade}</span>
        <span class="text-sm font-semibold mt-1" style="color:${st.label}">класс</span>
      `;
          card.addEventListener("click", () => openGrade(grade));
          gradesGrid.appendChild(card);
        });
      }

      // ─── ОТКРЫТЬ КЛАСС → ПРЕДМЕТЫ ────────────────────────────────────────────────
      async function openGrade(grade) {
        currentGrade = grade;
        showScreen("subjects");
        document.getElementById("subjects-title").textContent =
          `${grade} класс`;
        setBreadcrumb(`${grade} класс`);

        const list = document.getElementById("subjects-list");
        list.innerHTML = `<span class="spinner"></span>`;

        // Все записи для этого класса (student_class начинается с "7 ", "8 " и т.д.)
        const { data, error } = await db
          .from("library_books")
          .select("book_title, status")
          .ilike("student_class", `${grade} %`);

        if (error || !data) {
          list.innerHTML = `<p class="text-red-500">Ошибка: ${error?.message}</p>`;
          return;
        }

        // Группируем по предмету
        const subjectMap = new Map(); // title → { total, lost }
        data.forEach((r) => {
          const title = r.book_title?.trim();
          if (!title) return;
          if (!subjectMap.has(title))
            subjectMap.set(title, { total: 0, lost: 0 });
          const s = subjectMap.get(title);
          s.total++;
          if (r.status === "lost") s.lost++;
        });

        if (subjectMap.size === 0) {
          list.innerHTML = `<p class="text-gray-400 text-center py-10">Нет данных для этого класса</p>`;
          return;
        }

        const sorted = [...subjectMap.entries()].sort((a, b) =>
          a[0].localeCompare(b[0], "ru"),
        );

        list.innerHTML = "";
        sorted.forEach(([title, stats]) => {
          const card = document.createElement("div");
          card.className =
            "card px-5 py-4 flex items-center justify-between gap-4";
          card.innerHTML = `
        <div class="flex items-center gap-3 min-w-0">
          <div class="w-9 h-9 rounded-xl bg-blue-50 flex items-center justify-center flex-shrink-0">
            <svg width="18" height="18" fill="none" viewBox="0 0 24 24">
              <path stroke="#2563eb" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"
                    d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M4 19.5V5a2.5 2.5 0 0 1 2.5-2.5H20v15"/>
            </svg>
          </div>
          <div class="min-w-0">
            <p class="font-semibold text-gray-900 text-[14px] leading-snug truncate">${escHtml(title)}</p>
            <p class="text-xs text-gray-400 mt-0.5">${stats.total} уч.</p>
          </div>
        </div>
        <div class="flex items-center gap-2 flex-shrink-0">
          ${stats.lost > 0 ? `<span class="badge-lost">${stats.lost} утеряно</span>` : `<span class="badge-active">Всё ок</span>`}
          <svg width="16" height="16" fill="none" viewBox="0 0 24 24" class="text-gray-300">
            <path stroke="currentColor" stroke-width="2" stroke-linecap="round" d="m9 18 6-6-6-6"/>
          </svg>
        </div>
      `;
          card.addEventListener("click", () => openSubject(grade, title));
          list.appendChild(card);
        });
      }

      // ─── ОТКРЫТЬ ПРЕДМЕТ → УЧЕНИКИ ───────────────────────────────────────────────
      async function openSubject(grade, subject) {
        currentSubject = subject;
        showScreen("students");
        document.getElementById("students-title").textContent = subject;
        document.getElementById("students-subtitle").textContent =
          `${grade} класс`;
        setBreadcrumb(`${grade} класс → ${subject}`);

        const tbody = document.getElementById("students-tbody");
        tbody.innerHTML = `<tr><td colspan="4" class="py-8 text-center"><span class="spinner" style="margin:0 auto;"></span></td></tr>`;

        document.getElementById("back-to-subjects").onclick = () =>
          openGrade(grade);

        const { data, error } = await db
          .from("library_books")
          .select("*")
          .ilike("student_class", `${grade} %`)
          .eq("book_title", subject)
          .order("student_name");

        if (error || !data) {
          tbody.innerHTML = `<tr><td colspan="4" class="py-6 text-center text-red-500">Ошибка: ${error?.message}</td></tr>`;
          return;
        }

        // Счётчики
        const total = data.length;
        const lost = data.filter((r) => r.status === "lost").length;
        const ok = total - lost;

        document.getElementById("stat-total").textContent = `Всего: ${total}`;
        document.getElementById("stat-ok").textContent = `✓ Есть: ${ok}`;
        document.getElementById("stat-lost").textContent = `✗ Утеряно: ${lost}`;

        if (total === 0) {
          tbody.innerHTML = `<tr><td colspan="4" class="py-8 text-center text-gray-400">Нет данных</td></tr>`;
          return;
        }

        tbody.innerHTML = "";
        data.forEach((row, i) => {
          const isLost = row.status === "lost";
          const tr = document.createElement("tr");
          tr.style.borderBottom = "1px solid #f3f4f6";
          tr.innerHTML = `
        <td class="px-5 py-3 font-medium text-gray-900 text-[13px]">${escHtml(row.student_name)}</td>
        <td class="px-4 py-3 text-gray-500 text-[13px] hidden sm:table-cell">${escHtml(row.student_class)}</td>
        <td class="px-4 py-3 text-gray-500 text-[13px] font-mono">${escHtml(row.book_number)}</td>
        <td class="px-5 py-3 text-right">
          ${
            isLost
              ? `<span class="badge-lost">Утеряна</span>`
              : `<span class="badge-active">Есть</span>`
          }
        </td>
      `;
          tbody.appendChild(tr);
        });
      }

      // ─── НАВИГАЦИЯ ────────────────────────────────────────────────────────────────
      function showScreen(name) {
        document
          .querySelectorAll(".screen")
          .forEach((s) => s.classList.remove("active"));
        document.getElementById(`screen-${name}`).classList.add("active");
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function goHome() {
        currentGrade = null;
        currentSubject = null;
        showScreen("grades");
        setBreadcrumb("Все классы");
      }

      function setBreadcrumb(text) {
        document.getElementById("breadcrumb").textContent = text;
      }

      // ─── УТИЛИТЫ ─────────────────────────────────────────────────────────────────
      function escHtml(str) {
        return String(str ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      // Старт
      init();
    </script>
  </body>
</html>
